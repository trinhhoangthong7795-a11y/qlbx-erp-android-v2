name: Audit original QLBX source
on:
  push:
    branches:
      - erp-group/source-audit
    paths:
      - '.github/workflows/audit-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: erp-group/source-audit
          persist-credentials: true
      - name: Extract original archive
        shell: bash
        run: |
          set -euo pipefail
          archive="QLBX_ERP_Android_Source_v1.2.zip"
          test -f "$archive"
          mkdir -p source-audit
          unzip -oq "$archive" -d source-audit
      - name: Test original build without edits
        shell: bash
        run: |
          set +e
          project="source-audit/QLBX_ERP_Android_Source_v1.2.2-1"
          cd "$project"
          npm install --no-audit --no-fund > /tmp/npm-install.log 2>&1
          install_status=$?
          npm test > /tmp/npm-test.log 2>&1
          test_status=$?
          npm run build > /tmp/npm-build.log 2>&1
          build_status=$?
          npx vite build src --outDir ../dist-audit > /tmp/vite-src-build.log 2>&1
          src_build_status=$?
          cd "$GITHUB_WORKSPACE"
          {
            echo "# QLBX ERP v1.2.2 – source audit"
            echo
            echo "- Archive: QLBX_ERP_Android_Source_v1.2.zip"
            echo "- Internal package version: 1.2.2"
            echo "- Package ID: vn.qlbx.erp"
            echo "- Baseline npm install exit: $install_status"
            echo "- Baseline npm test exit: $test_status"
            echo "- Baseline npm run build exit: $build_status"
            echo "- Vite build using src as root exit: $src_build_status"
            echo
            echo "## npm install"
            tail -n 40 /tmp/npm-install.log
            echo
            echo "## npm test"
            tail -n 40 /tmp/npm-test.log
            echo
            echo "## npm run build"
            tail -n 60 /tmp/npm-build.log
            echo
            echo "## Vite build with src root"
            tail -n 60 /tmp/vite-src-build.log
          } > SOURCE_AUDIT_REPORT.md
      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "ERP Group"
          git config user.email "erp-group@users.noreply.github.com"
          git add SOURCE_AUDIT_REPORT.md
          git commit -m "Record original source build audit" || exit 0
          git push origin HEAD:erp-group/source-audit
