name: QLBX ERP Android build
run-name: Build QLBX ERP APK from original v1.2.2
on:
  push:
    branches:
      - erp-group/mobile-from-original-v1.2.2
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'src/**'
      - '.github/workflows/mobile-validation-original.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: erp-group/mobile-from-original-v1.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android platform
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Write validation report
        if: always()
        shell: bash
        run: |
          {
            echo "# QLBX ERP Android build report"
            echo
            echo "- Source: uploaded original HTML, copied to root index.html"
            echo "- Branch: erp-group/mobile-from-original-v1.2.2"
            echo "- Commit: $GITHUB_SHA"
            echo "- Node: $(node --version 2>/dev/null || true)"
            echo "- npm: $(npm --version 2>/dev/null || true)"
            echo
            echo "## Android output"
            if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "- APK generated: yes"
              echo "- APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            else
              echo "- APK generated: no"
            fi
          } > MOBILE_VALIDATION_REPORT.md
      - name: Upload APK and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qlbx-erp-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            MOBILE_VALIDATION_REPORT.md
          if-no-files-found: warn
      - name: Commit validation report
        if: always()
        shell: bash
        run: |
          git config user.name "ERP Group"
          git config user.email "erp-group@users.noreply.github.com"
          git add MOBILE_VALIDATION_REPORT.md
          git commit -m "Record Android APK build result" || exit 0
          git push origin HEAD:erp-group/mobile-from-original-v1.2.2
