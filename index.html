(function (root, factory) {
  const api = factory();

})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const ACTIVE = 'inside';
  function normalizeIdentity(input = {}) {
    const type = input.type === 'VIN6' ? 'VIN6' : 'PLATE';
    const value = String(type === 'VIN6' ? (input.vin6 ?? input.value ?? '') : (input.plate ?? input.value ?? '')).trim().toUpperCase().replace(/\s+/g, '');
    return { type, value };
  }
  function validateVehicleIdentity(input = {}) {
    if (!['PLATE', 'VIN6'].includes(input.type)) return { ok: false, message: 'Vui lòng chọn loại định danh xe.' };
    const { value } = normalizeIdentity(input);
    if (!value) return { ok: false, message: input.type === 'VIN6' ? 'Vui lòng nhập 6 số VIN cuối.' : 'Vui lòng nhập biển số xe.' };
    if (input.type === 'VIN6' && !/^[A-Z0-9]{6}$/.test(value)) return { ok: false, message: 'VIN cuối phải gồm đúng 6 ký tự chữ hoặc số.' };
    if (input.type === 'PLATE' && value.length < 4) return { ok: false, message: 'Biển số xe chưa hợp lệ.' };
    return { ok: true, value };
  }
  function sameIdentity(a, b) {
    if (!a || !b || a.type !== b.type) return false;
    return normalizeIdentity(a).value === normalizeIdentity(b).value;
  }
  function findActiveDuplicate(vehicles, candidate, excludeId) {
    return (vehicles || []).find(v => v.id !== excludeId && v.status === ACTIVE && sameIdentity(v, candidate)) || null;
  }
  function diffVehicle(before = {}, after = {}) {
    const keys = new Set([...Object.keys(before), ...Object.keys(after)]);
    const ignored = new Set(['updatedAt']);
    return [...keys].filter(k => !ignored.has(k) && JSON.stringify(before[k] ?? null) !== JSON.stringify(after[k] ?? null))
      .map(field => ({ field, before: before[field] ?? '', after: after[field] ?? '' }));
  }
  function ageBucket(days) {
    const n = Math.max(0, Number(days) || 0);
    if (n <= 10) return '0–10 ngày';
    if (n <= 20) return '11–20 ngày';
    if (n <= 30) return '21–30 ngày';
    return '>30 ngày';
  }
  function daysBetween(start, end = new Date()) {
    const a = new Date(start); const b = new Date(end);
    if (!Number.isFinite(a.getTime()) || !Number.isFinite(b.getTime())) return 0;
    return Math.max(0, Math.floor((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000));
  }
  function summarizeVehicles(vehicles, now = new Date()) {
    const active = (vehicles || []).filter(v => v.status === ACTIVE);
    const dated = active.filter(v => Boolean(v.dateIn || v.createdAt));
    const undated = active.length - dated.length;
    const buckets = { '0–10 ngày': 0, '11–20 ngày': 0, '21–30 ngày': 0, '>30 ngày': undated };
    dated.forEach(v => { buckets[ageBucket(daysBetween(v.dateIn || v.createdAt, now))] += 1; });
    return { total: active.length, datedTotal: dated.length, undated, buckets };
  }
  function validateBackupPayload(data) {
    if (!data || data.app !== 'QLBX ERP' || data.version !== 1) return { ok:false, message:'Không đúng định dạng hoặc phiên bản bản sao lưu QLBX ERP.' };
    for (const key of ['vehicles','logs','slots','events']) if (!Array.isArray(data[key])) return { ok:false, message:`Thiếu danh sách ${key} trong bản sao lưu.` };
    if (data.vehicles.length>100000 || data.slots.length>10000 || data.logs.length>500000) return { ok:false, message:'Tệp vượt giới hạn an toàn.' };
    const ids=new Set();
    for (const v of data.vehicles) {
      if (!v || typeof v.id!=='string' || !v.id || ids.has(v.id) || !['PLATE','VIN6'].includes(v.type) || !['inside','exited'].includes(v.status)) return { ok:false, message:'Hồ sơ xe có cấu trúc hoặc định danh không hợp lệ.' };
      ids.add(v.id); const valid=validateVehicleIdentity(v.type==='VIN6'?{type:'VIN6',vin6:v.vin6}:{type:'PLATE',plate:v.plate});
      if (!valid.ok) return { ok:false, message:`Hồ sơ xe ${v.id} không hợp lệ: ${valid.message}` };
    }
    const activeKeys=new Set();
    for (const v of data.vehicles.filter(x=>x.status==='inside')) { const n=normalizeIdentity(v),key=n.type+'|'+n.value; if(activeKeys.has(key)) return {ok:false,message:'Tệp có định danh xe đang trong bãi bị trùng.'}; activeKeys.add(key); if(v.position && !data.slots.some(s=>s.id===v.position&&s.vehicleId===v.id)) return {ok:false,message:`Vị trí của xe ${v.id} không khớp sơ đồ.`}; }
    const slotIds=new Set(),assigned=new Set();
    for (const s of data.slots) { if(!s||typeof s.id!=='string'||slotIds.has(s.id)||!Number.isInteger(s.lane)||!Number.isInteger(s.col)||!Number.isInteger(s.row)) return {ok:false,message:'Sơ đồ ô có cấu trúc không hợp lệ.'}; slotIds.add(s.id); if(s.vehicleId){ if(assigned.has(s.vehicleId))return {ok:false,message:'Một xe đang được gán vào nhiều ô trong tệp.'}; assigned.add(s.vehicleId); const v=data.vehicles.find(x=>x.id===s.vehicleId); if(!v||v.status!=='inside'||v.position!==s.id)return {ok:false,message:'Ô đang tham chiếu đến xe không còn trong bãi hoặc sai vị trí.'}; } }
    for (const v of data.vehicles) if(v.status==='exited'&&v.position) return {ok:false,message:`Xe đã xuất ${v.id} vẫn còn vị trí trong sơ đồ.`};
    return {ok:true};
  }
  function dateKey(value) {
    const d = new Date(value);
    if (!Number.isFinite(d.getTime())) return '';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return { normalizeIdentity, validateVehicleIdentity, findActiveDuplicate, diffVehicle, ageBucket, daysBetween, summarizeVehicles, validateBackupPayload, dateKey, sameIdentity };
});

<script>
(() => {
'use strict';
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
const nowISO = () => new Date().toISOString();
const fmtDate = v => { if(!v) return '—'; const d=new Date(v); return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('vi-VN'); };
const fmtDateTime = v => { if(!v) return '—'; const d=new Date(v); return Number.isNaN(d.getTime())?'—':d.toLocaleString('vi-VN',{hour12:false}); };
const displayId = v => v.type === 'VIN6' ? `VIN ${v.vin6 || ''}` : (v.plate || 'Chưa có biển');
const viewNames = {overview:'Tổng quan',vehicles:'Quản lý xe',entry:'Nhập bãi',exit:'Xuất bãi',yard:'Sơ đồ bãi',stocktake:'Kiểm kê',logs:'Nhật ký',reports:'Báo cáo',settings:'Hệ thống & danh mục'};
const DEFAULT_CATALOGS={models:['VF5','VFE34','Limo Green','Minio','EC Van','VF6','VF7','VF8','VF9'],colors:['Trắng','Đen','Đỏ','Xanh','Bạc','Xám'],personDepartments:['Thông / Kho'],teams:[],entryConditions:['Chờ sửa','Chờ giao GSM'],exitConditions:['Về xưởng','Giao GSM']};
const CATALOG_LABELS={models:'Dòng xe',colors:'Màu xe',personDepartments:'Tên / Bộ phận',teams:'Đội / Depot',entryConditions:'Tình trạng lượt vào',exitConditions:'Tình trạng lượt ra'};
let db, state={view:'overview',vehicles:[],logs:[],slots:[],events:[],meta:{},metaRecords:[],search:'',reportPeriod:'day',reportEvents:[],stocktake:null,stocktakeHistory:[]};

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('qlbx_erp',1);req.onupgradeneeded=()=>{const d=req.result;['vehicles','logs','slots','events'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
function getAll(store){return new Promise((resolve,reject)=>{const r=tx(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function getOne(store,key){return new Promise((resolve,reject)=>{const r=tx(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function put(store,value){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(value);t.oncomplete=()=>resolve(value);t.onerror=()=>reject(t.error);});}
function remove(store,key){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
function replaceAll(payload){return new Promise((resolve,reject)=>{const names=['vehicles','logs','slots','events','meta'];const t=db.transaction(names,'readwrite');names.forEach(n=>{const s=t.objectStore(n);s.clear();(payload[n]||[]).forEach(v=>s.put(v));});t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
async function refresh(){[state.vehicles,state.logs,state.slots,state.events]=await Promise.all(['vehicles','logs','slots','events'].map(getAll));state.meta=await getOne('meta','config')||{};state.metaRecords=await getAll('meta');state.stocktake=state.metaRecords.find(x=>x.key==='stocktake')?.value||null;state.stocktakeHistory=state.metaRecords.find(x=>x.key==='stocktake_history')?.value||[];}
function initialSlots(){const rows=[];const suffix=['T','TLD','PLD','P'];for(let lane=1;lane<=5;lane++)for(let col=1;col<=4;col++)for(let row=1;row<=20;row++)rows.push({id:`D${lane}-${col}-${row}`,lane,col,row,label:`${lane}${suffix[col-1]}-${row}`,vehicleId:null});return rows;}
async function init(){
  db=await openDB();
  const slots=await getAll('slots');
  if(!slots.length){const t=db.transaction(['slots','meta'],'readwrite');initialSlots().forEach(s=>t.objectStore('slots').put(s));t.objectStore('meta').put({key:'config',createdAt:nowISO(),version:1});await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);});}
  await refresh();if(!state.metaRecords.some(x=>x.key==='catalogs')){await put('meta',{key:'catalogs',value:DEFAULT_CATALOGS});await refresh();}$('#db-status').textContent='IndexedDB • dữ liệu cục bộ';$('#today-label').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});render();
}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600);}
function setView(view){closeModal();state.view=view;state.search='';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#mobile-more')?.classList.toggle('active',['exit','stocktake','logs','settings'].includes(view));$('#page-title').textContent=viewNames[view]||'QLBX ERP';render();window.scrollTo({top:0,behavior:'smooth'});}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="action-row">${actions}</div></div>`;}
function kpi(label,value,sub,icon,cls=''){return `<div class="card kpi ${cls}"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div><div class="kpi-icon">${icon}</div></div>`;}
function activeVehicles(){return state.vehicles.filter(v=>v.status==='inside');}
function findAnomalies(){
 const found=[],active=activeVehicles(),seen=new Map(),slotOwners=new Map(),slotIds=new Map();
 for(const v of active){const key=QLBXCore.normalizeIdentity(v).value+'|'+v.type;if(seen.has(key))found.push({level:'red',title:'Trùng định danh đang trong bãi',detail:`${displayId(v)} trùng với hồ sơ ${displayId(seen.get(key))}.`});else seen.set(key,v);if(!v.dateIn)found.push({level:'amber',title:'Thiếu ngày nhập bãi',detail:`${displayId(v)} chưa có ngày vào hợp lệ; được quy ước tồn trên 30 ngày.`});if(!v.position)found.push({level:'amber',title:'Xe chưa có vị trí',detail:`${displayId(v)} đang nằm trong danh sách chờ xếp hợp lệ.`});}
 for(const v of state.vehicles){if(v.status==='exited'&&v.position)found.push({level:'red',title:'Xe đã xuất nhưng còn vị trí',detail:`${displayId(v)} cần được giải phóng khỏi sơ đồ.`});if(v.dateIn&&v.dateOut&&new Date(v.dateOut)<new Date(v.dateIn))found.push({level:'red',title:'Mốc thời gian bất thường',detail:`${displayId(v)} có ngày xuất trước ngày nhập.`});}
 for(const slot of state.slots.filter(s=>s.vehicleId)){if(slotOwners.has(slot.vehicleId))found.push({level:'red',title:'Một xe chiếm nhiều ô',detail:`Xe ${slot.vehicleId} đang được gán ở nhiều vị trí.`});slotOwners.set(slot.vehicleId,slot);if(slotIds.has(slot.id))found.push({level:'red',title:'Mã ô bị trùng',detail:`Ô ${slot.label||slot.id} xuất hiện nhiều lần.`});slotIds.set(slot.id,slot);const v=state.vehicles.find(x=>x.id===slot.vehicleId);if(!v||v.status!=='inside')found.push({level:'red',title:'Ô đang gán hồ sơ không hợp lệ',detail:`Ô ${slot.label||slot.id} tham chiếu đến xe không tồn tại hoặc đã xuất.`});else if(v.position!==slot.id)found.push({level:'red',title:'Sơ đồ và hồ sơ không khớp',detail:`${displayId(v)} được gán ở ${slot.label||slot.id} nhưng hồ sơ xe lưu vị trí khác.`});}
 return found;
}
function assignedCount(){return activeVehicles().filter(v=>v.position).length;}
function catalogs(){const saved=state.metaRecords.find(x=>x.key==='catalogs')?.value||{};return Object.fromEntries(Object.keys(DEFAULT_CATALOGS).map(k=>[k,Array.isArray(saved[k])?saved[k]:DEFAULT_CATALOGS[k]]));}
function catalogOptions(key,current=''){const values=[...new Set([...catalogs()[key],...(current?[current]:[])])];return `<option value="">— Chưa chọn —</option>`+values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');}
function splitPersonDepartment(value){const parts=String(value||'').split(' / ');return {personIn:(parts.shift()||'').trim(),department:parts.join(' / ').trim()};}
async function saveCatalogs(next){await put('meta',{key:'catalogs',value:next});await refresh();render();}
function manageCatalog(key){const data=catalogs(),items=data[key]||[];modal(`Quản lý ${CATALOG_LABELS[key]}`,`<form id="catalog-form" data-key="${key}"><div class="field"><label>Thêm nội dung mới</label><div class="action-row"><input name="value" class="search-input" placeholder="Nhập ${CATALOG_LABELS[key].toLowerCase()} mới" required style="flex:1"><button class="btn btn-primary" type="submit">＋ Thêm</button></div></div></form><div style="margin-top:16px"><strong>Danh sách hiện có (${items.length})</strong>${items.length?items.map((v,i)=>`<div class="settings-action"><span>${esc(v)}</span><button class="btn btn-small btn-danger" data-action="remove-catalog-item" data-key="${key}" data-index="${i}">Xóa</button></div>`).join(''):'<p class="small muted">Chưa có mục nào.</p>'}</div><p class="hint">Xóa danh mục không làm thay đổi thông tin đã lưu trong hồ sơ xe.</p>`);}
async function addCatalogItem(form){const key=form.dataset.key,value=String(new FormData(form).get('value')||'').trim();if(!value)return;const data=catalogs();if(data[key].some(x=>x.toLocaleLowerCase('vi')===value.toLocaleLowerCase('vi'))){toast('Danh mục này đã tồn tại.');return;}data[key].push(value);await saveCatalogs(data);manageCatalog(key);toast('Đã thêm danh mục.');}
async function removeCatalogItem(key,index){const data=catalogs(),value=data[key]?.[index];if(value===undefined)return;if(!confirm(`Xóa mục “${value}” khỏi danh mục? Hồ sơ xe đã lưu không bị thay đổi.`))return;data[key].splice(index,1);await saveCatalogs(data);manageCatalog(key);toast('Đã xóa khỏi danh mục.');}

function vehicleRows(list){if(!list.length)return `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">▣</div><strong>Chưa có dữ liệu xe</strong><p>Hãy nhập xe đầu tiên để bắt đầu quản lý bãi.</p></div></td></tr>`;return list.map(v=>`<tr class="vehicle-row" data-action="vehicle-detail" data-id="${esc(v.id)}" tabindex="0" role="button" aria-label="Mở xử lý ${esc(displayId(v))}"><td><strong>${esc(displayId(v))}</strong><div class="small muted">${v.type==='VIN6'?'Không biển số':'Có biển số'}</div></td><td>${esc(v.model||'—')}</td><td>${esc(v.color||'—')}</td><td>${esc(v.department||'—')}</td><td>${fmtDate(v.dateIn)}</td><td>${esc(v.position?slotLabel(v.position):'Chờ xếp vị trí')}</td><td><span class="badge ${v.status==='inside'?'green':'muted'}">${v.status==='inside'?'Trong bãi':'Đã xuất'}</span><div class="small muted">Nhấn để xử lý ›</div></td></tr>`).join('');}
function slotLabel(id){return state.slots.find(s=>s.id===id)?.label||'Không xác định';}
function render(){const root=$('#app-content');let yardUi=null;if(state.view==='yard'){const sc=$('.yard-scroll');yardUi={open:[...$$('.yard-lane[open]')].map(x=>x.dataset.lane),top:sc?.scrollTop||0,left:sc?.scrollLeft||0,windowY:window.scrollY||0};}const map={overview:renderOverview,vehicles:renderVehicles,entry:renderEntry,exit:renderExit,yard:renderYard,stocktake:renderStocktake,logs:renderLogs,reports:renderReports,settings:renderSettings};root.innerHTML=(map[state.view]||renderOverview)();if(state.view==='yard'&&yardUi){yardUi.open.forEach(n=>{const d=$(`.yard-lane[data-lane="${n}"]`);if(d)d.open=true;});const sc=$('.yard-scroll');if(sc){sc.scrollTop=yardUi.top;sc.scrollLeft=yardUi.left;}window.scrollTo(0,yardUi.windowY);}if(state.view==='reports')drawReport();}
function renderOverview(){const active=activeVehicles(), anomalies=findAnomalies(), summary=QLBXCore.summarizeVehicles(state.vehicles), newCount=active.filter(v=>v.type==='VIN6').length, oldCount=active.length-newCount, unassigned=active.filter(v=>!v.position).length;const max=Math.max(1,...Object.values(summary.buckets));const buckets=Object.entries(summary.buckets).map(([k,v])=>`<div class="bucket-row"><span>${k}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%"></div></div><strong>${v}</strong></div>`).join('');const recent=state.logs.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,6);return `${pageHead('Tổng quan bãi xe','Tình hình vận hành được cập nhật trực tiếp từ dữ liệu trên thiết bị.',`<button class="btn btn-primary" data-view="entry">＋ Nhập xe</button><button class="btn" data-view="reports">Xem báo cáo</button>`)}<div class="grid kpi-grid">${kpi('Tổng xe trong bãi',active.length,'Số xe đang có mặt','▣')}${kpi('Xe có biển số',oldCount,'Định danh bằng biển số','▤','green')}${kpi('Xe không biển số',newCount,'Định danh bằng 6 số VIN','◇','amber')}${kpi('Chưa xếp vị trí',unassigned,'Xe đang chờ bố trí ô','⌖',unassigned?'red':'')}</div><div class="grid two-col"><div class="card"><div class="card-title"><h3>Tuổi tồn bãi</h3><span class="badge blue">Ngày nhập không rõ vẫn để trống; quy ước tính trên 30 ngày</span></div><div class="bucket-list">${buckets}</div><p class="small muted" style="margin:17px 0 0">Xe chưa xác định ngày nhập được xếp quy ước vào nhóm trên 30 ngày; ngày nhập vẫn để trống.</p></div><div class="card"><div class="card-title"><h3>Nhật ký gần đây</h3><button class="btn btn-small" data-view="logs">Xem tất cả</button></div>${recent.length?recent.map(l=>`<div class="event-item"><strong>${esc(l.title)}</strong><p>${esc(l.description||'')} · ${fmtDateTime(l.at)}</p></div>`).join(''):`<div class="empty-state"><div class="empty-icon">≡</div><strong>Chưa phát sinh hoạt động</strong><p>Nhật ký sẽ xuất hiện khi có thao tác.</p></div>`}</div></div><div class="card" style="margin-top:15px"><div class="card-title"><h3>Kiểm tra dữ liệu bất thường</h3><span class="badge ${anomalies.length?'amber':'green'}">${anomalies.length} cảnh báo</span></div>${anomalies.length?anomalies.slice(0,8).map(a=>`<div class="event-item"><strong><span class="badge ${a.level}">${a.level==='red'?'Cần xử lý':'Lưu ý'}</span> ${esc(a.title)}</strong><p>${esc(a.detail)}</p></div>`).join(''):`<div class="small muted">Chưa phát hiện bất thường từ các quy tắc hiện có.</div>`}</div><div class="card" style="margin-top:15px"><div class="card-title"><h3>Truy cập nhanh</h3><span class="small muted">Thao tác thường dùng</span></div><div class="action-row"><button class="btn btn-soft" data-view="entry">＋ Nhập bãi</button><button class="btn btn-soft" data-view="exit">↗ Xuất bãi</button><button class="btn btn-soft" data-view="yard">▤ Sơ đồ bãi</button><button class="btn btn-soft" data-view="stocktake">☑ Kiểm kê</button><button class="btn btn-soft" data-view="settings">⇩ Sao lưu dữ liệu</button></div></div>`;}
function filteredVehicles(){const q=(($('#vehicle-search')?.value)||state.search).toLowerCase(),status=$('#vehicle-filter')?.value||'all';return state.vehicles.filter(v=>(status==='all'||v.status===status)&&[v.plate,v.vin6,v.model,v.color,v.department,v.personIn,v.personOut].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}
function renderVehicles(){const q=state.search.toLowerCase();const list=state.vehicles.filter(v=>[v.plate,v.vin6,v.model,v.color,v.department,v.personIn,v.personOut].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${pageHead('Quản lý phương tiện','Tìm kiếm theo biển số, VIN6, mẫu xe, màu sắc, bộ phận hoặc người phụ trách.',`<button class="btn btn-primary" data-view="entry">＋ Thêm xe</button>`)}<div class="card"><div class="toolbar"><input class="search-input" id="vehicle-search" value="${esc(state.search)}" placeholder="Tìm kiếm ngay khi nhập…" aria-label="Tìm kiếm phương tiện"><select id="vehicle-filter" class="search-input" style="max-width:180px"><option value="all">Tất cả trạng thái</option><option value="inside">Trong bãi</option><option value="exited">Đã xuất</option></select><span class="badge blue" id="vehicle-count">${list.length} hồ sơ</span><button class="btn btn-small" data-action="export-filtered">Xuất bộ lọc</button><button class="btn btn-small" data-action="export-vehicles">Xuất tất cả</button></div><div class="table-wrap"><table><thead><tr><th>Định danh</th><th>Mẫu xe</th><th>Màu</th><th>Bộ phận</th><th>Ngày vào</th><th>Vị trí</th><th>Trạng thái / thao tác</th></tr></thead><tbody id="vehicle-table">${vehicleRows(list)}</tbody></table></div></div>`;}
function renderEntry(){const c=catalogs();return `${pageHead('Nhập xe vào bãi','Chỉ cần nhập biển số hoặc 6 ký tự VIN cuối. Các thông tin khác không bắt buộc.')}<div class="grid two-col"><div class="card"><div class="card-title"><h3>Thông tin phương tiện</h3><span class="badge green">Tạo lượt vào bãi</span></div><form id="entry-form"><div class="field-grid"><div class="field"><label>Loại định danh *</label><select name="type" id="entry-type"><option value="PLATE">Plate – Xe có biển số</option><option value="VIN6">No plate – Xe chưa có biển số</option></select></div><div class="field"><label id="identity-label">Biển số xe *</label><input name="identity" id="entry-identity" required placeholder="Ví dụ: 51A-123.45" autocomplete="off"><div id="identity-hints" class="hint"></div></div><div class="field"><label>Dòng xe</label><select name="model">${catalogOptions('models')}</select></div><div class="field"><label>Màu xe</label><select name="color">${catalogOptions('colors')}</select></div><div class="field"><label>Ngày giờ vào bãi</label><input name="dateIn" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field"><label>Tình trạng lượt vào</label><select name="entryCondition">${catalogOptions('entryConditions')}</select></div><div class="field"><label>Tên / Bộ phận</label><select name="personDepartment">${catalogOptions('personDepartments')}</select></div><div class="field"><label>Đội / Depot</label><select name="team">${catalogOptions('teams')}</select></div><div class="field full"><label>Ghi chú</label><textarea name="note" placeholder="Thông tin cần lưu ý (không bắt buộc)"></textarea></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Lưu nhập bãi</button></div></form></div><div class="card"><div class="card-title"><h3>Quy tắc nhập bãi</h3></div><div class="event-item"><strong>Xe có biển số (Plate)</strong><p>Nhập biển số xe. Hệ thống tự chuẩn hóa chữ hoa và khoảng trắng để kiểm tra trùng.</p></div><div class="event-item"><strong>Xe chưa có biển số (No plate)</strong><p>Nhập đúng 6 ký tự cuối VIN. Các hồ sơ VIN trùng trong lịch sử vẫn được hiển thị để lựa chọn.</p></div><div class="event-item"><strong>Chọn nhanh thông tin</strong><p>Dòng xe, màu xe, tên/bộ phận và đội/depot được lấy từ danh mục do bạn quản lý trong mục Hệ thống.</p></div></div></div>`;}
function renderExit(){const list=activeVehicles().sort((a,b)=>new Date(b.dateIn)-new Date(a.dateIn));return `${pageHead('Xuất xe khỏi bãi','Chọn đúng hồ sơ phương tiện, xác nhận xuất bãi để giải phóng vị trí.')}<div class="card"><div class="toolbar"><input id="exit-search" class="search-input" placeholder="Tìm biển số hoặc 6 số VIN…" aria-label="Tìm xe cần xuất"><span class="badge blue">${list.length} xe đang trong bãi</span></div><div class="table-wrap"><table><thead><tr><th>Định danh</th><th>Mẫu xe</th><th>Ngày vào</th><th>Vị trí</th><th>Người giao</th><th>Thao tác</th></tr></thead><tbody id="exit-table">${exitRows(list)}</tbody></table></div></div>`;}
function exitRows(list){return list.length?list.map(v=>`<tr><td><strong>${esc(displayId(v))}</strong></td><td>${esc(v.model||'—')}</td><td>${fmtDate(v.dateIn)}</td><td>${esc(v.position?slotLabel(v.position):'Chờ xếp')}</td><td>${esc(v.personIn||'—')}</td><td><button class="btn btn-small btn-danger" data-action="exit-vehicle" data-id="${esc(v.id)}">Xác nhận xuất</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">↗</div><strong>Không có xe trong bãi</strong><p>Danh sách xe đang ở bãi sẽ hiển thị tại đây.</p></div></td></tr>`;}
function renderYard(){const lanes=[...new Set(state.slots.map(s=>s.lane))].sort((a,b)=>a-b);const active=activeVehicles();return `${pageHead('Sơ đồ bãi xe','Tìm xe bằng một vài ký tự, chọn xe rồi chọn ô trống để xếp hoặc di chuyển.',`<button class="btn btn-soft" data-action="add-lane">＋ Thêm dãy</button>`)}<div class="card" style="margin-bottom:14px"><div class="toolbar" style="margin-bottom:8px"><input id="yard-search" class="search-input" placeholder="Tìm biển số, VIN6 hoặc dòng xe…" aria-label="Tìm xe để gán vị trí"><span class="badge blue">${active.length} xe đang trong bãi</span></div><div id="yard-search-results" class="yard-search-results"><span class="small muted">Nhập từ 1 ký tự để tìm xe. Có thể nhập một phần biển số hoặc VIN6.</span></div><div class="action-row" style="margin-top:12px"><span class="badge green">Xe mới / No plate</span><span class="badge amber">Xe cũ / Plate</span><span class="badge">Ô trống</span><span class="small muted">Đã xếp ${active.filter(v=>v.position).length}/${active.length} xe</span></div><p class="yard-drag-hint">Di chuyển nhanh: nhấn giữ xe khoảng 0,25 giây rồi kéo vào ô trống. Nếu cảm ứng không thuận tiện, dùng tìm xe ở trên hoặc chạm ô xe → Di chuyển ô.</p></div><div class="yard-scroll">${lanes.map(lane=>{const slots=state.slots.filter(s=>s.lane===lane).sort((a,b)=>a.row-b.row||a.col-b.col);return `<details class="yard-lane" data-lane="${lane}"><summary><span>Dãy ${lane} <span class="muted small">· ${slots.filter(s=>s.vehicleId).length}/${slots.length} ô có xe</span></span></summary><div class="yard-lane-body"><div class="action-row" style="margin-bottom:10px"><button class="btn btn-small" data-action="add-slot-row" data-lane="${lane}">＋ Thêm hàng ô</button><button class="btn btn-small" data-action="remove-slot-row" data-lane="${lane}">Xóa hàng cuối</button><button class="btn btn-small btn-danger" data-action="remove-lane" data-lane="${lane}">Xóa dãy</button></div><div class="yard-grid">${slots.map(s=>{const v=state.vehicles.find(x=>x.id===s.vehicleId&&x.status==='inside');return `<button class="slot ${v?'occupied '+(v.type==='VIN6'?'new':'old'):''}" data-action="slot-click" data-slot="${esc(s.id)}" ${v?`data-vehicle="${esc(v.id)}" aria-label="Giữ để di chuyển xe ${esc(displayId(v))} từ ô ${esc(s.label)}"`:''}><span class="slot-name">${esc(s.label)}</span><span class="slot-vehicle">${v?esc(v.type==='VIN6'?v.vin6:v.plate):'Ô trống'}</span></button>`;}).join('')}</div></div></details>`;}).join('')}</div>`;}
function normalizeSearch(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('vi').replace(/[^a-z0-9]/g,'');}
function drawYardSearch(value){const root=$('#yard-search-results');if(!root)return;const q=normalizeSearch(value);if(!q){root.innerHTML='<span class="small muted">Nhập từ 1 ký tự để tìm xe. Có thể nhập một phần biển số hoặc VIN6.</span>';return;}const matches=activeVehicles().filter(v=>[displayId(v),v.plate,v.vin6,v.model,v.color].some(x=>normalizeSearch(x).includes(q))).slice(0,12);root.innerHTML=matches.length?matches.map(v=>`<button class="yard-search-result" data-action="choose-yard-vehicle" data-id="${esc(v.id)}"><span><strong>${esc(displayId(v))}</strong><span class="small muted"> · ${esc(v.model||'Chưa rõ dòng xe')} · ${esc(v.position?slotLabel(v.position):'Chờ xếp')}</span></span><span class="badge ${v.position?'green':'amber'}">${v.position?'Đổi ô':'Gán ô'} ›</span></button>`).join(''):'<div class="small muted">Không tìm thấy xe phù hợp. Thử nhập ít ký tự hơn.</div>';}
function drawWaitingSearch(value){const root=$('#waiting-results'),hidden=$('#assign-vehicle'),selected=$('#waiting-selected');if(!root||!hidden)return;const q=normalizeSearch(value);if(!q){hidden.value='';if(selected)selected.textContent='';root.innerHTML='<span class="small muted">Nhập từ 1 ký tự để hiện xe phù hợp.</span>';return;}const matches=activeVehicles().filter(v=>!v.position&&[displayId(v),v.plate,v.vin6,v.model,v.color].some(x=>normalizeSearch(x).includes(q))).slice(0,12);root.innerHTML=matches.length?matches.map(v=>`<button type="button" class="yard-search-result" data-action="select-waiting-vehicle" data-id="${esc(v.id)}"><span><strong>${esc(displayId(v))}</strong><span class="small muted"> · ${esc(v.model||'Chưa rõ dòng xe')} · ${esc(v.color||'')}</span></span><span class="badge amber">Chọn xe ›</span></button>`).join(''):'<span class="small muted">Không tìm thấy xe chờ phù hợp. Thử nhập ít ký tự hơn.</span>';if(selected)selected.textContent='';hidden.value='';}
function selectWaitingVehicle(id){const v=activeVehicles().find(x=>x.id===id&&!x.position);if(!v)return;const hidden=$('#assign-vehicle'),input=$('#waiting-search'),results=$('#waiting-results'),selected=$('#waiting-selected');if(hidden)hidden.value=v.id;if(input)input.value=displayId(v);if(results)results.innerHTML='';if(selected)selected.innerHTML=`<span class="badge green">✓ Đã chọn</span> ${esc(displayId(v))} · ${esc(v.model||'Chưa rõ dòng xe')} <button type="button" class="btn btn-small" data-action="clear-waiting-selection">Đổi xe</button>`;}
function chooseYardVehicle(id){const v=state.vehicles.find(x=>x.id===id&&x.status==='inside');if(!v)return;const empty=state.slots.filter(s=>!s.vehicleId||s.id===v.position);if(!empty.some(s=>s.id!==v.position)){toast('Không còn ô trống. Hãy thêm ô hoặc đưa xe khác về chờ xếp.');return;}modal(`Chọn vị trí cho ${esc(displayId(v))}`,`<p class="small muted">${v.position?'Vị trí hiện tại: '+esc(slotLabel(v.position)):'Xe đang chờ xếp'}. Chọn một ô trống bên dưới.</p><div class="field"><label>Vị trí mới</label><select id="move-slot"><option value="">-- Chọn ô trống --</option>${empty.filter(s=>s.id!==v.position).map(s=>`<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('')}</select></div><div class="form-actions"><button class="btn" data-action="close-modal">Hủy</button><button class="btn btn-primary" data-action="confirm-move" data-id="${esc(v.id)}">Xác nhận gán vị trí</button></div>`);}

function renderStocktake(){const session=state.stocktake,history=state.stocktakeHistory||[];const archived=history.slice().sort((a,b)=>new Date(b.finishedAt)-new Date(a.finishedAt));return `${pageHead('Kiểm kê bãi xe','Mỗi đợt kiểm kê được lưu thành hồ sơ riêng; không mất kết quả khi kết thúc.',`<button class="btn btn-primary" data-action="start-stocktake" ${session?'disabled':''}>＋ Bắt đầu đợt mới</button>`)}${session?`<div class="card"><div class="card-title"><div><h3>Đợt kiểm kê đang thực hiện</h3><span class="small muted">Bắt đầu: ${fmtDateTime(session.startedAt)}</span></div><span class="badge blue">${session.items.length} xe trong danh sách</span></div><div class="grid three-col" style="margin-bottom:12px">${kpi('Đã kiểm tra',session.items.filter(i=>i.result==='checked').length,'Có mặt','✓','green')}${kpi('Thiếu xe',session.items.filter(i=>i.result==='missing').length,'Không tìm thấy','!','red')}${kpi('Sai vị trí',session.items.filter(i=>i.result==='wrong').length,'Khác vị trí hệ thống','⌖','amber')}</div>${session.items.map(i=>{const v=state.vehicles.find(x=>x.id===i.vehicleId);return `<div class="stocktake-item"><div><strong>${esc(v?displayId(v):i.identity)}</strong><small>Vị trí hệ thống: ${esc(i.expectedLabel||'Chờ xếp')} · ${esc(v?.model||'')}</small></div><span class="badge ${i.result==='checked'?'green':i.result==='missing'?'red':i.result==='wrong'?'amber':'blue'}">${i.result==='checked'?'Đã kiểm tra':i.result==='missing'?'Thiếu xe':i.result==='wrong'?'Sai vị trí':'Chưa kiểm tra'}</span><div class="stock-actions"><button class="btn btn-small btn-success" data-action="stock-result" data-id="${esc(i.vehicleId)}" data-result="checked">Có mặt</button><button class="btn btn-small btn-danger" data-action="stock-result" data-id="${esc(i.vehicleId)}" data-result="missing">Thiếu</button><button class="btn btn-small" data-action="stock-result" data-id="${esc(i.vehicleId)}" data-result="wrong">Sai vị trí</button></div></div>`}).join('')}<div class="card-title" style="margin-top:18px"><h3>Xe thực tế tìm thấy nhưng chưa có hồ sơ</h3><button class="btn btn-small btn-soft" data-action="add-stock-found">＋ Ghi nhận xe</button></div>${(session.foundVehicles||[]).map(x=>`<div class="event-item"><strong>${esc(x.identity)}</strong><p>${esc(x.note||'Chưa có ghi chú')} · ${fmtDateTime(x.foundAt)}</p></div>`).join('')||'<p class="small muted">Chưa ghi nhận xe ngoài danh sách hệ thống.</p>'}<div class="form-actions"><button class="btn btn-primary" data-action="finish-stocktake">Kết thúc và lưu đợt kiểm kê</button></div></div>`:`<div class="card"><div class="empty-state"><div class="empty-icon">☑</div><strong>Không có đợt kiểm kê đang mở</strong><p>Bắt đầu đợt mới để chụp danh sách xe hiện có trong bãi.</p></div></div>`}<div class="card" style="margin-top:15px"><div class="card-title"><h3>Lịch sử các đợt kiểm kê</h3><span class="badge blue">${archived.length} đợt đã lưu</span></div>${archived.length?archived.map(h=>`<div class="event-item"><strong>${fmtDateTime(h.startedAt)} – ${fmtDateTime(h.finishedAt)}</strong><p>${h.summary?.checked||0} có mặt · ${h.summary?.missing||0} thiếu · ${h.summary?.wrong||0} sai vị trí · ${(h.foundVehicles||[]).length} xe ngoài danh sách</p></div>`).join(''):'<p class="small muted">Chưa có đợt kiểm kê đã hoàn tất.</p>'}</div>`;}

function renderLogs(){const list=state.logs.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));return `${pageHead('Nhật ký hoạt động','Lưu vết nhập, xuất, di chuyển, chỉnh sửa, kiểm kê và diễn biến đặc biệt.')}<div class="card"><div class="toolbar"><input class="search-input" id="log-search" placeholder="Lọc nhật ký theo nội dung…"><span class="badge blue">${list.length} sự kiện</span></div><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Loại hoạt động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody id="log-table">${logRows(list)}</tbody></table></div></div>`;}
function logRows(list){return list.length?list.map(l=>`<tr><td>${fmtDateTime(l.at)}</td><td><span class="badge blue">${esc(l.type)}</span></td><td>${esc(l.vehicleLabel||'—')}</td><td>${esc(l.description||l.title)}</td></tr>`).join(''):`<tr><td colspan="4"><div class="empty-state">Chưa có nhật ký.</div></td></tr>`;}
function reportStats(){const active=activeVehicles(),old=active.filter(v=>v.type==='PLATE'),fresh=active.filter(v=>v.type==='VIN6'),older=active.filter(v=>v.type==='PLATE'&&QLBXCore.daysBetween(v.dateIn||v.createdAt)>10).length;const rangeStart=new Date();rangeStart.setDate(rangeStart.getDate()-6);rangeStart.setHours(0,0,0,0);const ins=state.vehicles.filter(v=>v.dateIn&&new Date(v.dateIn)>=rangeStart).length,outs=state.vehicles.filter(v=>v.dateOut&&new Date(v.dateOut)>=rangeStart).length;return {active,old,fresh,older,ins,outs};}
function renderReports(){const stats=reportStats(),summary=QLBXCore.summarizeVehicles(state.vehicles),events=state.events.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)),newExited=state.vehicles.filter(v=>v.type==='VIN6'&&v.status==='exited'&&v.dateOut).length;const buckets=Object.entries(summary.buckets).map(([k,v])=>`<div class="bucket-row"><span>${k}</span><div class="bar-track"><div class="bar-fill" style="width:${summary.total?Math.round(v/summary.total*100):0}%"></div></div><strong>${v}</strong></div>`).join('');return `${pageHead('Báo cáo tổng quan bãi xe','Bố cục theo mẫu tham khảo · số liệu lấy từ ngày nhập/xuất thực tế.',`<button class="btn btn-soft" data-action="report-png">⇩ Xuất PNG 1080px</button><button class="btn btn-primary" data-action="report-pdf">In / Lưu PDF</button>`)}<div class="report-heading"><strong>BÁO CÁO TỔNG QUAN BÃI XE</strong><span>7 ngày gần nhất · cập nhật ${new Date().toLocaleDateString('vi-VN')}</span></div><div class="grid kpi-grid report-kpis">${kpi('TỔNG XE TỒN BÃI',stats.active.length,'Xe hiện đang trong bãi','▣')}${kpi('XE CŨ CÓ BIỂN',stats.old.length,'Định danh biển số','▤','green')}${kpi('XE MỚI CHƯA BIỂN',stats.fresh.length,'Định danh VIN6','◇','green')}${kpi('XE CŨ TỒN TỪ 11 NGÀY',stats.older,'Theo ngày nhập thực tế','!','red')}</div><div class="grid two-col"><div class="card"><div class="card-title"><div><h3>Diễn biến xe tồn bãi trong tuần</h3><span class="small muted">Số xe còn tại bãi cuối mỗi ngày · so sánh xe cũ và xe mới</span></div></div><div id="weekly-stock-chart">${renderWeeklyStockChart()}</div></div><div class="card"><div class="card-title"><h3>Chỉ tiêu trong kỳ</h3></div><div class="report-metric"><span>Lượt xe vào</span><strong>${stats.ins}</strong></div><div class="report-metric"><span>Lượt xe ra</span><strong>${stats.outs}</strong></div><div class="report-metric"><span>Chờ sửa chữa</span><strong>${state.vehicles.filter(v=>v.status==='inside'&&/sửa/i.test(v.note||'')).length}</strong></div><div class="report-metric"><span>Chờ giao</span><strong>${state.vehicles.filter(v=>v.status==='inside'&&/giao/i.test(v.note||'')).length}</strong></div><div class="report-metric"><span>Xe mới đã xuất</span><strong>${newExited}</strong></div></div></div><div class="card report-aging"><div class="card-title"><h3>Cảnh báo xe tồn bãi</h3><span class="small muted">Xe chưa rõ ngày nhập được quy ước tính trên 30 ngày</span></div>${buckets}<p class="hint">Chưa xác định ngày nhập: ${summary.undated} xe · vẫn để trống ngày nhập và được tính vào nhóm trên 30 ngày.</p></div><div class="grid two-col" style="margin-top:15px"><div class="card"><div class="card-title"><h3>Diễn biến đặc biệt</h3><button class="btn btn-small btn-primary" data-action="add-event">＋ Thêm</button></div>${events.length?events.map(e=>`<div class="event-item"><strong>${esc(e.title)}</strong><p>${fmtDate(e.at)} · ${esc(e.description)}</p></div>`).join(''):`<div class="empty-state"><strong>Chưa có diễn biến đặc biệt</strong><p>Thêm các sự kiện cần ghi nhận trong báo cáo.</p></div>`}</div><div class="card"><div class="card-title"><h3>Chọn sự kiện đưa vào báo cáo</h3><span class="badge amber">Tối đa 5</span></div>${events.length?events.map(e=>`<label class="event-item" style="display:flex;gap:9px;align-items:flex-start"><input type="checkbox" data-event-check="${esc(e.id)}" ${state.reportEvents.includes(e.id)?'checked':''}><span><strong>${esc(e.title)}</strong><p>${fmtDate(e.at)} · ${esc(e.description)}</p></span></label>`).join(''):`<p class="small muted">Chưa có sự kiện để chọn.</p>`}</div></div><div class="card" style="margin-top:15px"><div class="card-title"><h3>Xem trước báo cáo xuất</h3><span class="small muted">Ảnh 1080px phù hợp gửi Zalo</span></div><canvas id="report-canvas" class="report-canvas" width="1080" height="1120"></canvas></div>`;}
function renderWeeklyStockChart(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);d.setHours(23,59,59,999);const key=d.toDateString();const inside=state.vehicles.filter(v=>(!(v.dateIn||v.createdAt)||new Date(v.dateIn||v.createdAt)<=d)&&(!v.dateOut||new Date(v.dateOut)>d));days.push({label:d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}),old:inside.filter(v=>v.type==='PLATE').length,fresh:inside.filter(v=>v.type==='VIN6').length});}const max=Math.max(1,...days.map(d=>d.old+d.fresh));return `<div class="weekly-bars">${days.map(d=>`<div class="weekly-day"><div class="weekly-stack"><div class="weekly-old" style="height:${d.old/max*150}px" title="Xe cũ ${d.old}"></div><div class="weekly-new" style="height:${d.fresh/max*150}px" title="Xe mới ${d.fresh}"></div></div><span>${d.label}</span><small>${d.old+d.fresh}</small></div>`).join('')}</div><div class="small muted" style="display:flex;gap:16px;margin-top:8px"><span>■ Xe cũ có biển</span><span>■ Xe mới chưa biển</span></div>`;}
function renderInOutBars(){const now=new Date();const periods=[];for(let i=5;i>=0;i--){const d=new Date(now);if(state.reportPeriod==='day')d.setDate(d.getDate()-i);else if(state.reportPeriod==='week')d.setDate(d.getDate()-7*i);else d.setMonth(d.getMonth()-i);periods.push(d);}const transitions=state.vehicles.flatMap(v=>[{at:v.dateIn,kind:'in'},{at:v.dateOut,kind:'out'}].filter(x=>x.at));const groups=periods.map(d=>{let start,end,label;if(state.reportPeriod==='day'){start=new Date(d.getFullYear(),d.getMonth(),d.getDate());end=new Date(start);end.setDate(end.getDate()+1);label=d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});}else if(state.reportPeriod==='week'){start=new Date(d);start.setDate(start.getDate()-start.getDay()+1);start.setHours(0,0,0,0);end=new Date(start);end.setDate(end.getDate()+7);label=`T${Math.ceil(d.getDate()/7)}/${d.getMonth()+1}`;}else{start=new Date(d.getFullYear(),d.getMonth(),1);end=new Date(d.getFullYear(),d.getMonth()+1,1);label=`T${d.getMonth()+1}`;}const items=transitions.filter(x=>new Date(x.at)>=start&&new Date(x.at)<end);return {label,in:items.filter(x=>x.kind==='in').length,out:items.filter(x=>x.kind==='out').length};});const max=Math.max(1,...groups.flatMap(g=>[g.in,g.out]));return `<div class="small muted" style="display:flex;gap:15px;margin-bottom:12px"><span>● Nhập bãi</span><span>● Xuất bãi</span></div><div style="display:flex;gap:10px;align-items:end;height:160px;padding:4px 0 22px">${groups.map(g=>`<div style="flex:1;height:100%;display:flex;align-items:end;justify-content:center;gap:3px;position:relative"><div title="Nhập ${g.in}" style="width:12px;height:${Math.max(2,g.in/max*100)}%;background:#3479b9;border-radius:4px 4px 0 0"></div><div title="Xuất ${g.out}" style="width:12px;height:${Math.max(2,g.out/max*100)}%;background:#24a174;border-radius:4px 4px 0 0"></div><small style="position:absolute;bottom:-20px;font-size:9px;color:#8494a8">${g.label}</small></div>`).join('')}</div>`;}
function renderSettings(){const c=catalogs();const catalogCards=Object.keys(CATALOG_LABELS).map(key=>`<div class="settings-action"><div><strong>${CATALOG_LABELS[key]}</strong><p>${c[key].length} mục trong danh sách</p></div><button class="btn btn-small btn-primary" data-action="manage-catalog" data-key="${key}">Quản lý</button></div>`).join('');return `${pageHead('Thiết lập hệ thống','Quản lý danh mục, sao lưu và đồng bộ dữ liệu.')}<div class="card" style="margin-bottom:15px"><div class="card-title"><h3>Đồng bộ đám mây Firebase</h3><span class="badge blue" id="cloud-status">Đăng nhập để đồng bộ</span></div><p class="hint">Đăng nhập bằng tài khoản do quản trị viên cấp. Dữ liệu vẫn được lưu trên thiết bị; chỉ đồng bộ khi bạn chủ động chọn thao tác.</p><div id="cloud-account"><form id="cloud-login-form" class="settings-action" style="display:grid;grid-template-columns:1fr;gap:10px"><input name="email" type="email" autocomplete="username" placeholder="Email tài khoản" required><input name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required><button class="btn btn-primary" type="submit">Đăng nhập Firebase</button></form></div><div class="action-row" style="margin-top:12px;flex-wrap:wrap"><button class="btn btn-primary" data-action="cloud-upload">Sao lưu lên Firebase</button><button class="btn" data-action="cloud-restore">Khôi phục từ Firebase</button><button class="btn btn-danger" data-action="cloud-logout">Đăng xuất</button></div><p class="hint">Sao lưu lên Firebase sẽ thay thế bộ dữ liệu đám mây của bãi xe này. Khôi phục sẽ thay thế toàn bộ dữ liệu trên thiết bị. Hãy chọn đúng chiều thao tác.</p></div><div class="card" style="margin-bottom:15px"><div class="card-title"><h3>Quản lý danh mục</h3><span class="badge blue">Dùng chung toàn hệ thống</span></div>${catalogCards}<p class="hint">Thêm hoặc xóa từng mục tại đây. Xóa danh mục không xóa dữ liệu xe đã được ghi nhận trước đó.</p></div><div class="grid settings-grid"><div class="card"><div class="card-title"><h3>Sao lưu & khôi phục</h3><span class="badge green">Khuyến nghị định kỳ</span></div><div class="settings-action"><div><strong>Sao lưu toàn bộ dữ liệu JSON</strong><p>Gồm xe, nhật ký, sơ đồ, sự kiện, danh mục, đợt kiểm kê đang mở và lịch sử kiểm kê đã hoàn tất.</p></div><button class="btn btn-primary" data-action="backup-json">Tải JSON</button></div><div class="settings-action"><div><strong>Khôi phục từ JSON</strong><p>Thay thế toàn bộ dữ liệu trên thiết bị hiện tại.</p></div><button class="btn" data-action="restore-json">Chọn tệp</button></div><div class="settings-action"><div><strong>Khôi phục cài đặt gốc</strong><p>Xóa toàn bộ dữ liệu xe, nhật ký, diễn biến và kiểm kê; tạo lại sơ đồ 5 dãy mặc định cùng danh mục ban đầu. Không thể hoàn tác.</p></div><button class="btn btn-danger" data-action="factory-reset">Xóa dữ liệu & đặt lại</button></div><input type="file" id="restore-file" accept="application/json,.json" class="hidden"></div><div class="card"><div class="card-title"><h3>Xuất dữ liệu Excel</h3><span class="badge blue">CSV tương thích Excel</span></div><div class="settings-action"><div><strong>Danh sách phương tiện</strong><p>Xuất toàn bộ hồ sơ xe và trạng thái hiện tại.</p></div><button class="btn" data-action="export-vehicles">Xuất CSV</button></div><div class="settings-action"><div><strong>Nhật ký hoạt động</strong><p>Xuất lịch sử nhập, xuất, chỉnh sửa và kiểm kê.</p></div><button class="btn" data-action="export-logs">Xuất CSV</button></div></div><div class="card"><div class="card-title"><h3>Cấu hình sơ đồ</h3></div><div class="settings-action"><div><strong>Số dãy hiện tại</strong><p>${new Set(state.slots.map(s=>s.lane)).size} dãy · ${state.slots.length} ô</p></div><button class="btn" data-view="yard">Mở sơ đồ</button></div><div class="settings-action"><div><strong>Quy tắc lưu trữ</strong><p>Xe đã xuất không còn chiếm vị trí; lịch sử vẫn được giữ lại.</p></div><span class="badge green">Đang áp dụng</span></div></div><div class="card"><div class="card-title"><h3>Thông tin ứng dụng</h3></div><div class="settings-action"><div><strong>QLBX ERP – Quản lý bãi xe</strong><p>Phiên bản 1.2.2 · Lưu trữ IndexedDB trên thiết bị này.</p></div><span class="badge blue">Offline-first</span></div><div class="warning-box">Dữ liệu được lưu trong hồ sơ trình duyệt trên thiết bị. Xóa dữ liệu trình duyệt, đổi trình duyệt hoặc đổi thiết bị có thể làm mất dữ liệu nếu chưa sao lưu. Hãy tải JSON định kỳ và giữ ít nhất một bản sao bên ngoài thiết bị.</div></div></div>`;}
function log(type,title,description,vehicle,details={}){return put('logs',{id:uid(),type,title,description,vehicleId:vehicle?.id||null,vehicleLabel:vehicle?displayId(vehicle):'',vehicleType:vehicle?.type||'',actor:'Thiết bị hiện tại',at:nowISO(),...details});}
function cloudLoginModal(){modal('Đăng nhập Firebase',`<form id="cloud-login-form" class="form-grid"><div class="field full"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field full"><label>Mật khẩu</label><input name="password" type="password" autocomplete="current-password" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">Đăng nhập</button></div></form>`);}
async function cloudUpload(){try{if(!window.QLBXFirebase)throw new Error('Mô-đun Firebase chưa sẵn sàng.');if(!confirm('Sao lưu từ thiết bị này lên Firebase? Dữ liệu đám mây của bãi xe sẽ được thay thế.'))return;toast('Đang sao lưu lên Firebase…');const payload=await window.QLBXLocal.snapshot();const result=await window.QLBXFirebase.replaceCloud(payload);toast(`Đã sao lưu Firebase: ${result.count} bản ghi.`);}catch(e){alert('Không thể sao lưu Firebase: '+(e.message||e));}}
async function cloudRestore(){try{if(!window.QLBXFirebase)throw new Error('Mô-đun Firebase chưa sẵn sàng.');if(!confirm('Khôi phục từ Firebase sẽ THAY THẾ toàn bộ dữ liệu đang có trên thiết bị. Bạn đã sao lưu dữ liệu hiện tại chưa?'))return;toast('Đang đọc dữ liệu Firebase…');const payload=await window.QLBXFirebase.restoreCloud();if(!payload.slots?.length)throw new Error('Chưa có bản sao lưu hợp lệ trên Firebase. Hãy sao lưu từ thiết bị chính trước.');const check=QLBXCore.validateBackupPayload(payload);if(!check.ok)throw new Error(check.message);await window.QLBXLocal.replace({vehicles:payload.vehicles,logs:payload.logs,slots:payload.slots,events:payload.events,meta:payload.meta||[]});toast('Đã khôi phục dữ liệu từ Firebase.');}catch(e){alert('Không thể khôi phục Firebase: '+(e.message||e));}}
async function cloudLogout(){try{await window.QLBXFirebase?.logout();render();toast('Đã đăng xuất Firebase.');}catch(e){alert(e.message||e);}}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="modal-close" data-action="close-modal" aria-label="Đóng">×</button></div><div class="modal-body">${body}</div></div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
async function submitEntry(form){const fd=new FormData(form),type=fd.get('type'),identity=String(fd.get('identity')||'');const input=type==='VIN6'?{type,vin6:identity}:{type,plate:identity};const valid=QLBXCore.validateVehicleIdentity(input);if(!valid.ok){toast(valid.message);return;}const duplicate=QLBXCore.findActiveDuplicate(state.vehicles,input);if(duplicate){toast(`Xe đã ở trong bãi: ${displayId(duplicate)}. Không thể nhập trùng.`);return;}const pd=splitPersonDepartment(fd.get('personDepartment'));const dateIn=fd.get('dateIn')?new Date(fd.get('dateIn')).toISOString():nowISO();const v={id:uid(),type,plate:type==='PLATE'?valid.value:'',vin6:type==='VIN6'?valid.value:'',model:String(fd.get('model')||'').trim(),color:String(fd.get('color')||'').trim(),department:pd.department,team:String(fd.get('team')||'').trim(),personIn:pd.personIn,personOut:'',dateIn,dateOut:null,entryCondition:String(fd.get('entryCondition')||''),exitCondition:'',note:String(fd.get('note')||'').trim(),position:null,status:'inside',createdAt:nowISO(),updatedAt:nowISO()};await put('vehicles',v);await log('Nhập bãi','Nhập xe vào bãi',[`Tiếp nhận ${displayId(v)}${v.model?' · '+v.model:''}`,v.entryCondition?`Tình trạng lượt vào: ${v.entryCondition}`:''].filter(Boolean).join(' · '),v);await refresh();toast('Đã lưu xe vào bãi.');setView('vehicles');}
function exitVehicle(id){const v=state.vehicles.find(x=>x.id===id);if(!v||v.status!=='inside')return;const c=catalogs();const currentOut=[v.personOut,v.departmentOut].filter(Boolean).join(' / ');const options=[...new Set([...(c.personDepartments||[]),...(currentOut?[currentOut]:[])])];modal('Xác nhận xuất bãi',`<p><strong>${esc(displayId(v))}</strong> · ${esc(v.model||'')}</p><form id="exit-form" data-id="${esc(v.id)}"><div class="field-grid"><div class="field"><label>Ngày giờ xuất</label><input name="dateOut" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}" required></div><div class="field"><label>Tình trạng lượt ra</label><select name="exitCondition" required>${catalogOptions('exitConditions')}</select></div><div class="field"><label>Người nhận xe / Bộ phận</label><select name="personDepartment"><option value="">— Không bắt buộc —</option>${options.map(x=>`<option value="${esc(x)}" ${x===currentOut?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field full"><label>Ghi chú lượt xuất</label><textarea name="exitNote" placeholder="Ví dụ: Bàn giao GSM, chuyển về xưởng sửa chữa… (không bắt buộc)">${esc(v.exitNote||'')}</textarea></div></div><div class="warning-box">Sau khi xác nhận, xe sẽ được chuyển sang trạng thái Đã xuất và ô đang sử dụng sẽ được giải phóng. Ghi chú lượt xuất được lưu riêng, không ghi đè ghi chú nhập bãi.</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Hủy</button><button type="submit" class="btn btn-danger">Xác nhận xuất xe</button></div></form>`);}
async function submitExit(form){const v=state.vehicles.find(x=>x.id===form.dataset.id);if(!v||v.status!=='inside')return;const fd=new FormData(form),dateOut=fd.get('dateOut')?new Date(fd.get('dateOut')).toISOString():nowISO();if(v.dateIn&&new Date(dateOut)<new Date(v.dateIn)){toast('Ngày xuất không được trước ngày nhập.');return;}const receiver=splitPersonDepartment(fd.get('personDepartment'));const exitCondition=String(fd.get('exitCondition')||'').trim();if(!exitCondition){toast('Vui lòng chọn tình trạng lượt ra.');return;}const exitNote=String(fd.get('exitNote')||'').trim();const updated={...v,status:'exited',dateOut,personOut:receiver.personIn,departmentOut:receiver.department,exitCondition,exitNote,position:null,updatedAt:nowISO()};await put('vehicles',updated);if(v.position){const s=state.slots.find(x=>x.id===v.position);if(s)await put('slots',{...s,vehicleId:null});}const details=[`${displayId(v)} đã xuất khỏi bãi.`,`Tình trạng lượt ra: ${exitCondition}`,receiver.personIn?`Người nhận: ${receiver.personIn}`:'',receiver.department?`Bộ phận nhận: ${receiver.department}`:'',exitNote?`Ghi chú lượt xuất: ${exitNote}`:''].filter(Boolean).join(' · ');await log('Xuất bãi','Xuất xe khỏi bãi',details,updated);await refresh();closeModal();toast('Đã xác nhận xuất bãi.');render();}
function vehicleDetail(id){const v=state.vehicles.find(x=>x.id===id);if(!v)return;modal('Hồ sơ phương tiện',`<div class="grid two-col"><div><div class="eyebrow">ĐỊNH DANH</div><h2 style="margin:4px 0 14px">${esc(displayId(v))}</h2><span class="badge ${v.status==='inside'?'green':'muted'}">${v.status==='inside'?'Trong bãi':'Đã xuất'}</span></div><div><div class="small muted">Vị trí</div><strong>${esc(v.position?slotLabel(v.position):'Không có')}</strong></div></div><div class="field-grid" style="margin-top:18px"><div><span class="small muted">Mẫu xe</span><p><strong>${esc(v.model||'—')}</strong></p></div><div><span class="small muted">Màu xe</span><p><strong>${esc(v.color||'—')}</strong></p></div><div><span class="small muted">Ngày vào</span><p><strong>${fmtDateTime(v.dateIn)}</strong></p></div><div><span class="small muted">Tình trạng lượt vào</span><p><strong>${esc(v.entryCondition||'—')}</strong></p></div><div><span class="small muted">Ngày xuất</span><p><strong>${fmtDateTime(v.dateOut)}</strong></p></div><div><span class="small muted">Người giao</span><p><strong>${esc(v.personIn||'—')}</strong></p></div><div><span class="small muted">Bộ phận</span><p><strong>${esc(v.department||'—')}</strong></p></div>${v.dateOut?`<div><span class="small muted">Người nhận</span><p><strong>${esc(v.personOut||'—')}</strong></p></div><div><span class="small muted">Bộ phận nhận</span><p><strong>${esc(v.departmentOut||'—')}</strong></p></div><div><span class="small muted">Tình trạng lượt ra</span><p><strong>${esc(v.exitCondition||'—')}</strong></p></div><div class="field full"><span class="small muted">Ghi chú lượt xuất</span><p><strong>${esc(v.exitNote||'—')}</strong></p></div>`:''}</div><div class="form-actions"><button class="btn" data-action="close-modal">Đóng</button><button class="btn btn-primary" data-action="edit-vehicle" data-id="${esc(v.id)}">Chỉnh sửa</button>${v.status==='inside'?`<button class="btn btn-danger" data-action="exit-vehicle" data-id="${esc(v.id)}">Xuất bãi</button>`:''}</div>`);}
function editVehicle(id){const v=state.vehicles.find(x=>x.id===id);if(!v)return;const personDepartment=[v.personIn,v.department].filter(Boolean).join(' / '),c=catalogs();modal('Chỉnh sửa hồ sơ xe',`<form id="edit-form" data-id="${esc(v.id)}"><div class="field-grid"><div class="field"><label>Loại định danh</label><select name="type"><option value="PLATE" ${v.type==='PLATE'?'selected':''}>Plate</option><option value="VIN6" ${v.type==='VIN6'?'selected':''}>No plate / VIN6</option></select></div><div class="field"><label>Biển số / 6 số VIN</label><input name="identity" value="${esc(v.type==='VIN6'?v.vin6:v.plate)}" required></div><div class="field"><label>Dòng xe</label><select name="model">${catalogOptions('models',v.model)}</select></div><div class="field"><label>Màu xe</label><select name="color">${catalogOptions('colors',v.color)}</select></div><div class="field"><label>Tên / Bộ phận</label><select name="personDepartment">${catalogOptions('personDepartments',personDepartment)}</select></div><div class="field"><label>Người nhận</label><input name="personOut" value="${esc(v.personOut)}"></div><div class="field"><label>Đội / Depot</label><select name="team">${catalogOptions('teams',v.team)}</select></div><div class="field"><label>Ngày giờ vào</label><input name="dateIn" type="datetime-local" value="${v.dateIn?new Date(new Date(v.dateIn).getTime()-new Date(v.dateIn).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field"><label>Tình trạng lượt vào</label><select name="entryCondition">${catalogOptions('entryConditions',v.entryCondition||'')}</select></div><div class="field"><label>Ngày giờ xuất</label><input name="dateOut" type="datetime-local" value="${v.dateOut?new Date(new Date(v.dateOut).getTime()-new Date(v.dateOut).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div><div class="field"><label>Tình trạng lượt ra</label><select name="exitCondition">${catalogOptions('exitConditions',v.exitCondition||'')}</select></div><div class="field full"><label>Ghi chú</label><textarea name="note">${esc(v.note)}</textarea></div></div><div class="warning-box">Mọi thay đổi sẽ được ghi vào nhật ký với giá trị cũ và mới.</div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Hủy</button><button type="submit" class="btn btn-primary">Lưu thay đổi</button><button type="button" class="btn btn-danger" data-action="delete-vehicle" data-id="${esc(v.id)}">Xóa hồ sơ</button></div></form>`);}
async function saveEdit(form){const id=form.dataset.id,v=state.vehicles.find(x=>x.id===id);if(!v)return;const fd=new FormData(form),type=fd.get('type'),identity=String(fd.get('identity')||'');const candidate=type==='VIN6'?{type,vin6:identity}:{type,plate:identity};const valid=QLBXCore.validateVehicleIdentity(candidate);if(!valid.ok){toast(valid.message);return;}const dup=QLBXCore.findActiveDuplicate(state.vehicles,candidate,id);if(dup){toast('Định danh này đã thuộc một xe đang trong bãi.');return;}const pd=splitPersonDepartment(fd.get('personDepartment'));const updated={...v,type,plate:type==='PLATE'?valid.value:'',vin6:type==='VIN6'?valid.value:'',model:String(fd.get('model')||'').trim(),color:String(fd.get('color')||'').trim(),personIn:pd.personIn,personOut:String(fd.get('personOut')||'').trim(),department:pd.department,team:String(fd.get('team')||'').trim(),dateIn:fd.get('dateIn')?new Date(fd.get('dateIn')).toISOString():v.dateIn,dateOut:fd.get('dateOut')?new Date(fd.get('dateOut')).toISOString():null,entryCondition:String(fd.get('entryCondition')||''),exitCondition:String(fd.get('exitCondition')||''),note:String(fd.get('note')||'').trim(),updatedAt:nowISO()};if(updated.status==='inside'&&updated.dateOut){updated.status='exited';updated.position=null;}const changes=QLBXCore.diffVehicle(v,updated);if(!changes.length){toast('Không có thay đổi để lưu.');return;}await put('vehicles',updated);await log('Chỉnh sửa','Cập nhật hồ sơ phương tiện',changes.map(c=>`${c.field}: ${c.before} → ${c.after}`).join(' | '),updated,{auditChanges:changes.map(c=>({field:c.field,before:c.before,after:c.after}))});if(v.position&&updated.status==='exited'){const s=state.slots.find(x=>x.id===v.position);if(s)await put('slots',{...s,vehicleId:null});}await refresh();closeModal();toast('Đã lưu thay đổi và nhật ký kiểm toán.');render();}
async function deleteVehicle(id){const v=state.vehicles.find(x=>x.id===id);if(!v)return;if(!confirm(`Xóa vĩnh viễn hồ sơ ${displayId(v)}?`))return;const second=prompt('Nhập XOA để xác nhận lần cuối:');if(second!=='XOA'){toast('Đã hủy thao tác xóa.');return;}if(v.position){const s=state.slots.find(x=>x.id===v.position);if(s)await put('slots',{...s,vehicleId:null});}await remove('vehicles',id);await log('Xóa hồ sơ','Xóa vĩnh viễn hồ sơ xe',`${displayId(v)} đã bị xóa theo xác nhận hai bước`,v);await refresh();closeModal();toast('Đã xóa hồ sơ.');render();}
function slotClick(id){const slot=state.slots.find(s=>s.id===id);if(!slot)return;const v=state.vehicles.find(x=>x.id===slot.vehicleId&&x.status==='inside');if(v){modal(`Ô ${esc(slot.label)}`,`<div class="card" style="box-shadow:none"><h2 style="margin:0 0 5px">${esc(displayId(v))}</h2><p class="small muted">${esc(v.model||'Chưa có mẫu xe')} · ${esc(v.color||'')}</p><span class="badge ${v.type==='VIN6'?'green':'amber'}">${v.type==='VIN6'?'Xe mới / No plate':'Xe có biển số'}</span></div><div class="form-actions"><button class="btn" data-action="close-modal">Đóng</button><button class="btn" data-action="edit-vehicle" data-id="${esc(v.id)}">Sửa thông tin</button><button class="btn" data-action="remove-slot" data-id="${esc(v.id)}">Đưa về chờ xếp</button><button class="btn btn-primary" data-action="move-vehicle" data-id="${esc(v.id)}">Di chuyển ô</button><button class="btn btn-danger" data-action="exit-vehicle" data-id="${esc(v.id)}">Xuất bãi</button></div>`);}else{const waiting=activeVehicles().filter(x=>!x.position);modal(`Xếp xe vào ${esc(slot.label)}`,`${waiting.length?`<div class="field"><label>Tìm xe chờ xếp</label><input id="waiting-search" class="search-input" placeholder="Gõ vài ký tự biển số hoặc VIN6…" autocomplete="off" aria-label="Tìm xe chờ xếp"><input type="hidden" id="assign-vehicle"><div id="waiting-results" class="yard-search-results"><span class="small muted">Nhập từ 1 ký tự để hiện xe phù hợp.</span></div><div id="waiting-selected" class="small muted" style="margin-top:7px"></div></div><div class="form-actions"><button class="btn" data-action="close-modal">Hủy</button><button class="btn" data-view="entry">Nhập xe mới</button><button class="btn btn-primary" data-action="assign-slot" data-slot="${esc(slot.id)}">Xếp vào ô</button></div>`:`<div class="empty-state"><strong>Không có xe chờ xếp</strong><p>Hãy nhập xe hoặc đưa xe từ ô khác về danh sách chờ.</p><button class="btn btn-primary" data-view="entry">Nhập xe mới</button></div>`}`);}}
async function assignSlot(slotId,vehicleId){const slot=state.slots.find(s=>s.id===slotId),v=state.vehicles.find(x=>x.id===vehicleId);if(!slot||!v||v.status!=='inside')return;if(slot.vehicleId){toast('Ô này đã có xe.');return;}const old=v.position;if(old){const oldSlot=state.slots.find(s=>s.id===old);if(oldSlot)await put('slots',{...oldSlot,vehicleId:null});}await put('slots',{...slot,vehicleId:v.id});await put('vehicles',{...v,position:slotId,updatedAt:nowISO()});await log(old?'Di chuyển':'Xếp vị trí',old?'Di chuyển xe trên sơ đồ':'Xếp xe vào vị trí',`${displayId(v)} đã thay đổi vị trí trên sơ đồ.`,v);await refresh();closeModal();toast('Đã cập nhật vị trí xe.');render();}
async function removeFromSlot(id){const v=state.vehicles.find(x=>x.id===id);if(!v||!v.position)return;const old=v.position,s=state.slots.find(x=>x.id===old);if(s)await put('slots',{...s,vehicleId:null});await put('vehicles',{...v,position:null,updatedAt:nowISO()});await log('Chờ xếp','Đưa xe về danh sách chờ',`${displayId(v)} đã được đưa về danh sách chờ xếp.`,v);await refresh();closeModal();toast('Xe đã được đưa về danh sách chờ.');render();}
function moveVehicle(id){const v=state.vehicles.find(x=>x.id===id);if(!v)return;const empty=state.slots.filter(s=>!s.vehicleId);modal('Di chuyển phương tiện',`<p class="small muted">${esc(displayId(v))} · Vị trí hiện tại: ${esc(slotLabel(v.position))}</p><div class="field"><label>Chọn ô trống mới</label><select id="move-slot"><option value="">-- Chọn vị trí --</option>${empty.map(s=>`<option value="${s.id}">${esc(s.label)}</option>`).join('')}</select></div><div class="form-actions"><button class="btn" data-action="close-modal">Hủy</button><button class="btn btn-primary" data-action="confirm-move" data-id="${id}">Xác nhận di chuyển</button></div>`);}
async function startStocktake(){if(state.stocktake){toast('Đang có một đợt kiểm kê. Hãy hoàn tất hoặc tiếp tục đợt hiện tại.');return;}const items=activeVehicles().map(v=>({vehicleId:v.id,identity:displayId(v),expectedPosition:v.position,expectedLabel:v.position?slotLabel(v.position):'Chờ xếp',result:'pending'}));state.stocktake={id:uid(),startedAt:nowISO(),items,foundVehicles:[]};await put('meta',{key:'stocktake',value:state.stocktake});await log('Kiểm kê','Bắt đầu kiểm kê',`Tạo đợt kiểm kê với ${items.length} xe.`);await refresh();toast('Đã tạo đợt kiểm kê.');render();}
function addStockFound(){if(!state.stocktake)return;modal('Ghi nhận xe thực tế ngoài danh sách',`<form id="stock-found-form"><div class="field-grid"><div class="field"><label>Loại định danh</label><select name="type"><option value="PLATE">Biển số</option><option value="VIN6">VIN6</option></select></div><div class="field"><label>Biển số / VIN6</label><input name="identity" required placeholder="Nhập định danh thực tế"></div><div class="field full"><label>Ghi chú / vị trí tìm thấy</label><textarea name="note" placeholder="Ví dụ: Thực tế ở Dãy 2, ô 2T-4"></textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu ghi nhận</button></div></form>`);}
async function saveStockFound(form){if(!state.stocktake)return;const fd=new FormData(form),type=String(fd.get('type')),identity=String(fd.get('identity')||'').trim().toUpperCase();if(!identity){toast('Vui lòng nhập định danh.');return;}if(type==='VIN6'&& !/^[A-Z0-9]{6}$/.test(identity)){toast('VIN6 phải gồm đúng 6 ký tự chữ/số.');return;}state.stocktake.foundVehicles=state.stocktake.foundVehicles||[];state.stocktake.foundVehicles.push({id:uid(),type,identity,note:String(fd.get('note')||'').trim(),foundAt:nowISO()});await put('meta',{key:'stocktake',value:state.stocktake});await log('Kiểm kê','Ghi nhận xe ngoài danh sách',`${identity} được phát hiện thực tế nhưng chưa có hồ sơ hệ thống.`);await refresh();closeModal();render();}
function markWrongPosition(id){if(!state.stocktake)return;const slots=state.slots;modal('Ghi nhận sai vị trí',`<p class="small muted">Chọn vị trí thực tế tìm thấy của xe trong quá trình kiểm kê.</p><div class="field"><label>Vị trí thực tế</label><select id="actual-stock-slot"><option value="">-- Chọn vị trí --</option>${slots.map(s=>`<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('')}</select></div><div class="form-actions"><button class="btn" data-action="close-modal">Hủy</button><button class="btn btn-primary" data-action="save-wrong-position" data-id="${esc(id)}">Lưu sai vị trí</button></div>`);}
async function saveWrongPosition(id){const actual=$('#actual-stock-slot')?.value;if(!actual){toast('Vui lòng chọn vị trí thực tế.');return;}if(!state.stocktake)return;const target=state.stocktake.items.find(i=>i.vehicleId===id);if(target){target.result='wrong';target.actualPosition=actual;target.actualLabel=slotLabel(actual);target.checkedAt=nowISO();}await put('meta',{key:'stocktake',value:state.stocktake});const v=state.vehicles.find(x=>x.id===id);await log('Kiểm kê','Ghi nhận sai vị trí',`${displayId(v)}: hệ thống ${target?.expectedLabel||'—'}, thực tế ${slotLabel(actual)}.`,v);await refresh();closeModal();render();}
async function stockResult(id,result){if(!state.stocktake)return;state.stocktake.items=state.stocktake.items.map(i=>i.vehicleId===id?{...i,result,checkedAt:nowISO()}:i);await put('meta',{key:'stocktake',value:state.stocktake});const v=state.vehicles.find(x=>x.id===id);await log('Kiểm kê',result==='checked'?'Xác nhận có mặt':'Đánh dấu thiếu xe',`${displayId(v||{type:'PLATE',plate:id})}: ${result}`,v);await refresh();render();}
async function finishStocktake(){if(!state.stocktake)return;if(!confirm('Kết thúc và lưu vĩnh viễn kết quả đợt kiểm kê này?'))return;const session=state.stocktake,summary={checked:session.items.filter(i=>i.result==='checked').length,missing:session.items.filter(i=>i.result==='missing').length,wrong:session.items.filter(i=>i.result==='wrong').length,pending:session.items.filter(i=>i.result==='pending').length};const archived={...session,finishedAt:nowISO(),summary};const history=[...(state.stocktakeHistory||[]),archived];await put('meta',{key:'stocktake_history',value:history});await remove('meta','stocktake');state.stocktake=null;await log('Kiểm kê','Hoàn tất đợt kiểm kê',`Kết quả: ${summary.checked} có mặt, ${summary.missing} thiếu, ${summary.wrong} sai vị trí, ${summary.pending} chưa kiểm tra, ${(session.foundVehicles||[]).length} xe ngoài danh sách.`);await refresh();toast('Đã lưu kết quả vào lịch sử kiểm kê.');render();}

function addEvent(){modal('Thêm diễn biến đặc biệt',`<form id="event-form"><div class="field-grid"><div class="field"><label>Ngày diễn biến</label><input name="date" type="datetime-local" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}" required></div><div class="field"><label>Tiêu đề</label><input name="title" required placeholder="Ví dụ: Kiểm kê đột xuất"></div><div class="field full"><label>Nội dung diễn biến</label><textarea name="description" required placeholder="Mô tả nội dung cần ghi nhận…"></textarea></div></div><div class="form-actions"><button type="button" class="btn" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu diễn biến</button></div></form>`);}
async function saveEvent(form){const fd=new FormData(form),e={id:uid(),at:new Date(fd.get('date')).toISOString(),title:String(fd.get('title')).trim(),description:String(fd.get('description')).trim(),createdAt:nowISO()};await put('events',e);await log('Diễn biến đặc biệt',e.title,e.description);await refresh();closeModal();toast('Đã lưu diễn biến.');render();}
function csvEscape(v){return `"${String(v??'').replace(/"/g,'""')}"`;}

function exportCSV(kind,override){const source=override|| (kind==='vehicles'?state.vehicles:state.logs);const rows=kind==='vehicles'?source.map(v=>[displayId(v),v.type,v.model,v.color,v.department,v.departmentOut||'',v.team,v.personIn,v.personOut,v.dateIn,v.entryCondition||'',v.dateOut,v.exitCondition||'',v.status,v.position?slotLabel(v.position):'',v.note,v.exitNote||'']):source.map(l=>[l.at,l.type,l.title,l.vehicleLabel,l.description]);const headers=kind==='vehicles'?['Dinh danh','Loai xe','Mau xe','Mau sac','Bo phan nhap','Bo phan nhan','Doi kho','Nguoi giao','Nguoi nhan','Ngay vao','Tinh trang luot vao','Ngay xuat','Tinh trang luot ra','Trang thai','Vi tri','Ghi chu nhap','Ghi chu xuat']:['Thoi gian','Loai','Tieu de','Xe','Chi tiet'];const csv='\ufeff'+[headers,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');download(`QLBX_${kind}_${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv;charset=utf-8');toast('Đã tạo tệp CSV tương thích Excel.');}

function onInput(e){if(e.target.id==='yard-search'){drawYardSearch(e.target.value);}if(e.target.id==='vehicle-search'){state.search=e.target.value;const list=filteredVehicles();$('#vehicle-table').innerHTML=vehicleRows(list);if($('#vehicle-count'))$('#vehicle-count').textContent=`${list.length} hồ sơ`;}if(e.target.id==='waiting-search'){drawWaitingSearch(e.target.value);}if(e.target.id==='exit-search'){const q=e.target.value.toLowerCase();$('#exit-table').innerHTML=exitRows(activeVehicles().filter(v=>[v.plate,v.vin6,v.model].join(' ').toLowerCase().includes(q)));}if(e.target.id==='log-search'){const q=e.target.value.toLowerCase();$('#log-table').innerHTML=logRows(state.logs.filter(l=>[l.title,l.type,l.description,l.vehicleLabel].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.at)-new Date(a.at)));}if(e.target.id==='entry-identity'&&$('#entry-type')?.value==='VIN6'){const value=e.target.value.trim().toUpperCase();const matches=value.length===6?state.vehicles.filter(v=>v.type==='VIN6'&&v.vin6===value):[];$('#identity-hints').innerHTML=matches.length?`Đã có ${matches.length} hồ sơ VIN6 trong lịch sử: `+matches.map(v=>`<button type="button" class="btn btn-small" data-action="vehicle-detail" data-id="${esc(v.id)}">${esc(v.vin6)} · ${v.status==='inside'?'Trong bãi':'Đã xuất'} · ${fmtDate(v.dateIn)}</button>`).join(' '):'';}}
function onChange(e){if(e.target.id==='vehicle-filter'){const list=filteredVehicles();$('#vehicle-table').innerHTML=vehicleRows(list);if($('#vehicle-count'))$('#vehicle-count').textContent=`${list.length} hồ sơ`;}if(e.target.id==='restore-file'&&e.target.files?.[0]){restoreJSON(e.target.files[0]);e.target.value='';}if(e.target.id==='entry-type'){$('#identity-label').textContent=e.target.value==='VIN6'?'6 số VIN cuối *':'Biển số xe *';$('#entry-identity').placeholder=e.target.value==='VIN6'?'Ví dụ: 123456':'Ví dụ: 51A-123.45';$('#identity-hints').innerHTML='';}if(e.target.matches('[data-event-check]')){const id=e.target.dataset.eventCheck;if(e.target.checked){if(state.reportEvents.length>=5){e.target.checked=false;toast('Chỉ được chọn tối đa 5 diễn biến.');return;}state.reportEvents.push(id);}else state.reportEvents=state.reportEvents.filter(x=>x!==id);drawReport();}}
window.QLBXLocal={snapshot:async()=>({app:'QLBX ERP',version:1,exportedAt:nowISO(),vehicles:await getAll('vehicles'),logs:await getAll('logs'),slots:await getAll('slots'),events:await getAll('events'),meta:await getAll('meta')}),replace:async p=>{await replaceAll(p);await refresh();render();}};
document.addEventListener('pointerdown',yardPointerDown,{passive:true});document.addEventListener('pointermove',yardPointerMove,{passive:false});document.addEventListener('pointerup',yardPointerUp);document.addEventListener('pointercancel',yardPointerCancel);document.addEventListener('click',onClick);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.vehicle-row')){e.preventDefault();vehicleDetail(e.target.dataset.id);}});document.addEventListener('submit',onSubmit);document.addEventListener('input',onInput);document.addEventListener('change',onChange);
init().then(async()=>{const s=await getOne('meta','stocktake');if(s?.value){state.stocktake=s.value;if(state.view==='stocktake')render();}}).catch(err=>{console.error(err);$('#db-status').textContent='Lỗi khởi tạo';$('#app-content').innerHTML=`<div class="card"><h2>Không thể mở kho dữ liệu</h2><p>${esc(err.message)}</p><p class="muted">Hãy mở ứng dụng bằng Chrome/Edge mới nhất và kiểm tra quyền lưu trữ của trình duyệt.</p></div>`;});
if('serviceWorker'in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();

</script>
<script type="module" src="/src/native-bridge.js"></script>
